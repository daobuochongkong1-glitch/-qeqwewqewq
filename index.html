<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Học bảng chữ cái tiếng Nhật - Hiragana & Katakana</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Bảng chữ cái tiếng Nhật</h1>
    <p class="subtitle">Click vào từng chữ để nghe phát âm (audio: mazii.net)</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="hiragana">ひらがな Hiragana</button>
    <button class="tab-btn" data-tab="katakana">カタカナ Katakana</button>
  </nav>

  <main class="container">
    <section id="hiragana" class="tab-panel active"></section>
    <section id="katakana" class="tab-panel"></section>
  </main>

  <audio id="player" preload="none"></audio>

  <footer class="app-footer">
    <span>Click chữ → phát âm • Phím <kbd>1</kbd>/<kbd>2</kbd> để chuyển tab</span>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
